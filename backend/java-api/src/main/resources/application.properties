server.port=9090

# Shared SQLite database used by the Java, Python and PHP services.
# Paths are relative to backend/java-api (run the service from that folder).
carverse.db-path=${CARVERSE_DB:../database/carverse.db}
spring.datasource.url=jdbc:sqlite:${carverse.db-path}?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4

# Create tables on start-up (sample cars are loaded by CarRepository when the table is empty).
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/schema.sql

# Send the error message (e.g. "Car name and brand are required.") back to the frontend.
server.error.include-message=always
